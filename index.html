<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ancymoncia</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Ancymoncia</h1>
<p>Ręcznie robione biżuteria, ceramika i inne rękodzieło!</p>

<div class="search">
  <input type="text" id="searchInput" placeholder="Wyszukaj ...">
</div>

<div class="filters">

  <h3>Kategoria</h3>
  <button onclick="setCategory('all', this)">Wszystko</button>
  <button onclick="setCategory('jewellery', this)">Biżuteria</button>
  <button onclick="setCategory('accessory', this)">Akcesoria</button>

  <div id="typeFilters">
    <h3>Podkategoria</h3>
  </div>

  <h3>Tematyka</h3>
  <button onclick="setVibe('all', this)">Wszystko</button>
  <button onclick="setVibe('crystals', this)">Kryształy</button>
  <button onclick="setVibe('floral', this)">Kwiaty</button>
  <button onclick="setVibe('sweets', this)">Słodkie</button>

</div>

<div class="grid">

{% for produkt in site.produkty %}

<div class="item"
     onclick="openModal(this)"
     data-name="{{ produkt.name }}"
     data-price="{{ produkt.price }}"
     data-vibe="{{ produkt.vibe }}"
     data-description="{{ produkt.description }}"
     data-images='{{ produkt.images | jsonify }}'>

  <img src="{{ produkt.images[0] }}">
  <h3>{{ produkt.name }}</h3>
  <p>{{ produkt.price }} zł</p>

</div>

{% endfor %}

</div>

<div id="modal" class="modal">

  <div class="modal-content">

    <span class="close" onclick="closeModal()">×</span>

    <div class="gallery">
      <button onclick="prevImage()">‹</button>
      <img id="modalImage" src="">
      <button onclick="nextImage()">›</button>
    </div>

    <h2 id="modalTitle"></h2>
    <p id="modalPrice"></p>
    <p id="modalVibe"></p>
    <p id="modalDescription"></p>

  </div>

</div>

<script src="/assets/js/script.js"></script>
</body>
</html>
